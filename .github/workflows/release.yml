name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # The always-on half. One image, both architectures, so it runs on an ARM VPS
  # or a NAS as readily as on x86.
  service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The desktop app. macOS is built twice: Apple Silicon and Intel.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, target: aarch64-apple-darwin, args: '--target aarch64-apple-darwin' }
          - { platform: macos-latest, target: x86_64-apple-darwin, args: '--target x86_64-apple-darwin' }
          - { platform: windows-latest, target: '', args: '' }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        # Block style, not `with: { targets: ${{ ... }} }`. In a YAML flow
        # mapping the `{{` of an expression opens a nested mapping, so the file
        # does not parse at all — and GitHub reports that only by falling back
        # to the file path where the workflow name should be.
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './apps/desktop/src-tauri -> target' }
      - run: npm ci
      - run: npm run build -w @runpod-launcher/shared -w @runpod-launcher/i18n
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'RunPod Launcher ${{ github.ref_name }}'
          # Stated plainly rather than discovered on first launch. Signing needs
          # a paid Apple Developer account; until there is one, macOS shows an
          # "unverified developer" warning and Windows shows SmartScreen.
          releaseBody: |
            The desktop app is **not code-signed**. On first launch:

            - **macOS**: right-click the app → Open → Open. Once per version.
            - **Windows**: More info → Run anyway.

            The service image is at `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`.
          releaseDraft: true
          args: ${{ matrix.args }}
