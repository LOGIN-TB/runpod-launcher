name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Screenshots are generated, not committed by hand. Running the pipeline in CI
  # is what stops the in-app help from illustrating a version of the interface
  # that no longer exists.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture
        run: |
          DATA_DIR=./ci-data PORT=8080 ALLOW_UI_ORIGIN=http://localhost:5173 \
            node apps/service/dist/index.js > service.log 2>&1 &
          npm run dev -w @runpod-launcher/desktop > ui.log 2>&1 &
          npx wait-on http://localhost:8080/health http://localhost:5173 -t 60000
          CODE=$(grep -oE '[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}' service.log | head -1)
          TOKEN=$(node tools/screenshots/seed.mjs http://localhost:8080 "$CODE")
          DEVICE_TOKEN="$TOKEN" node tools/screenshots/capture.mjs \
            --ui http://localhost:5173 --service http://localhost:8080
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/

  # The service image. Built on every pull request to prove it still builds, and
  # published as `:latest` from main — which is what the `docker-compose.yml` in
  # this repository refers to. Without that, following the install instructions
  # on a fresh clone fails with "manifest unknown", because a version tag only
  # exists once a release has been cut.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both architectures, so the same image runs on an ARM VPS or a NAS.
          # Only on main: emulating arm64 roughly doubles the build, which is
          # not worth paying for on every pull request.
          platforms: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:main-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
